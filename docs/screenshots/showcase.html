/* ---------- celestial header (replicates CelestialCanvas).
   Everything is clipped to the header box: the sky only fills the top
   `h` pixels, the page body below stays on the plain scaffold color. ---------- */
function celestial(P, h, r, cy, waterY, wave, overlay){
  const scale = r / 52;
  let paths = '';
  for(let i=0;i<5;i++){
    const y = waterY + i*14*scale;
    const w = ((160 + i*40) + 30*wave) * scale;
    const alpha = (0.4 - (i/5)*0.28).toFixed(3);
    const sw = (2.5 - (i/5)*0.8) * Math.max(scale,.8);
    const startX = 135 - w/2, endX = 135 + w/2;
    let d = `M ${startX.toFixed(1)} ${y.toFixed(1)}`;
    for(let x=startX; x<=endX; x+=6){
      const rel = (x-startX)/w;
      const off = Math.sin(rel*Math.PI*3 + i) * (2.5 + wave*6);
      d += ` L ${x.toFixed(1)} ${(y+off).toFixed(2)}`;
    }
    paths += `<path d="${d}" stroke="${P.cel}" stroke-opacity="${alpha}" stroke-width="${sw.toFixed(2)}" fill="none" stroke-linecap="round"/>`;
  }
  return `
  <div class="abs" style="top:0;left:0;width:270px;height:${h}px;overflow:hidden;">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,${P.sky[0]} 0%,${P.sky[1]} 50%,${P.sky[2]} 100%);"></div>
    <div style="position:absolute;left:${135-r-26}px;top:${cy-r-26}px;width:${(r+26)*2}px;height:${(r+26)*2}px;border-radius:50%;
         background:radial-gradient(circle, rgba(${P.celGlow},.38) 0%, rgba(${P.celGlow},.16) 46%, rgba(${P.celGlow},0) 70%);"></div>
    <div style="position:absolute;left:${135-r}px;top:${cy-r}px;width:${r*2}px;height:${r*2}px;border-radius:50%;background:${P.cel};"></div>
    <svg style="position:absolute;top:0;left:0" width="270" height="${h}">${paths}</svg>
    ${overlay || ''}
  </div>`;
}

    <div style="display:flex;align-items:center;margin-top:10px;">
      <span style="color:${P.t1};font-size:14px;font-weight:600;">${STR.chatTitle}</span>
      <span style="margin-left:auto;display:flex;">${icon('close',16,P.t2)}</span>
    </div>
    <div style="margin-top:14px;">
      ${bubble(STR.msgOther1,STR.msgText1,false)}
      ${bubble('',STR.msgSelf,true)}
      ${bubble(STR.msgOther2,STR.msgText2,false)}
    </div>
    <div style="position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;">
      <div style="flex:1;height:36px;background:#121B2B;border-radius:18px;display:flex;align-items:center;
           padding:0 13px;color:${P.t2};font-size:11px;">${STR.inputPh}</div>
      <div style="width:30px;height:30px;border-radius:50%;background:${P.accent};margin-left:8px;
           display:flex;align-items:center;justify-content:center;">${icon('send',13,'#fff')}</div>
    </div>
  </div>`;
}

/* ---------- assemble ---------- */
function phone(inner){return `<div class="phone"><div class="screen">${inner}<div class="punch"></div></div></div>`;}

const screens = {
  home: phone(screenHome()),
  wifi: phone(screenRoom(DAY, STR.roomName, false, true)),
  ble:  phone(screenRoom(NIGHT, STR.bleRoomName, true, true)),
  chat: phone(screenChat())
};

const stage = document.getElementById('stage');
if(mode === 'all'){
  stage.style.width='1360px'; stage.style.height='708px';
  stage.innerHTML = screens.home + screens.wifi + screens.ble + screens.chat;
}else{
  stage.style.width='360px'; stage.style.height='708px';
  stage.innerHTML = screens[mode];
}
</script>
</body>
</html>
