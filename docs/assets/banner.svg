<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="落日后残波 SunsetRipple — 近场语音对讲">
  <defs>
    <linearGradient id="sky" x1="600" y1="0" x2="600" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B0E2B"/>
      <stop offset="0.42" stop-color="#8E2A3E"/>
      <stop offset="0.74" stop-color="#B92F3B"/>
      <stop offset="0.93" stop-color="#FF7138"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="sea" x1="600" y1="196" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8452F"/>
      <stop offset="0.35" stop-color="#8E2536"/>
      <stop offset="1" stop-color="#3A1030"/>
    </linearGradient>
    <linearGradient id="sun" x1="905" y1="120" x2="905" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE59A"/>
      <stop offset="1" stop-color="#FFD06B"/>
    </linearGradient>
    <radialGradient id="glow" cx="905" cy="196" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD06B" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FF7138" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF7138" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="skyClip"><rect x="0" y="0" width="1200" height="196"/></clipPath>
    <clipPath id="seaClip"><rect x="0" y="196" width="1200" height="144"/></clipPath>
  </defs>

  <rect width="1200" height="340" fill="#2B0E2B"/>
  <rect width="1200" height="196" fill="url(#sky)"/>
  <rect y="196" width="1200" height="144" fill="url(#sea)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <g clip-path="url(#skyClip)">
    <circle cx="905" cy="196" r="76" fill="url(#sun)"/>
  </g>

  <line x1="0" y1="196" x2="1200" y2="196" stroke="#FFC98A" stroke-opacity="0.45" stroke-width="1.2"/>

  <g clip-path="url(#seaClip)" fill="none" stroke="#FFE09A" stroke-linecap="round">
    <path d="M765,214 Q905,244 1045,214" stroke-width="5" stroke-opacity="0.72"/>
    <path d="M726,240 Q905,282 1084,240" stroke-width="4.4" stroke-opacity="0.5"/>
    <path d="M687,268 Q905,318 1123,268" stroke-width="3.8" stroke-opacity="0.32"/>
    <path d="M648,297 Q905,354 1162,297" stroke-width="3.2" stroke-opacity="0.18"/>
    <path d="M609,325 Q905,388 1201,325" stroke-width="2.6" stroke-opacity="0.09"/>
  </g>

  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif">
    <text x="86" y="146" fill="#FFF3DC" font-size="68" font-weight="700" letter-spacing="7">落日后残波</text>
    <text x="90" y="192" fill="#FFD8A8" font-size="28" font-weight="500" letter-spacing="12">SUNSETRIPPLE</text>
    <text x="88" y="252" fill="#FFCFA0" fill-opacity="0.92" font-size="19" letter-spacing="1.5">近场语音对讲 · 不联网 · 无服务器 · 最多 6 台设备</text>
    <text x="88" y="284" fill="#FFC08A" fill-opacity="0.6" font-size="15" font-style="italic" letter-spacing="0.6">Off-grid near-field intercom for Android</text>
  </g>
</svg>
