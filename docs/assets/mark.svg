<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="落日后残波">
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="80" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C97C66"/>
      <stop offset="0.55" stop-color="#9B4A52"/>
      <stop offset="1" stop-color="#392832"/>
    </linearGradient>
    <linearGradient id="sun" x1="80" y1="48" x2="80" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0C7"/>
      <stop offset="0.58" stop-color="#F3DCAA"/>
      <stop offset="1" stop-color="#D0AC72"/>
    </linearGradient>
    <clipPath id="squircle">
