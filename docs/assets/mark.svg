    <line x1="20" y1="80" x2="140" y2="80" stroke="#F3DCAA" stroke-opacity="0.4" stroke-width="1.6"/>
    <g fill="none" stroke="#F3DCAA" stroke-linecap="round">
      <path d="M44,89 Q80,124 116,89" stroke-width="5" stroke-opacity="0.85"/>
      <path d="M31,104 Q80,148 129,104" stroke-width="4.2" stroke-opacity="0.66"/>
      <path d="M19,119 Q80,171 141,119" stroke-width="3.4" stroke-opacity="0.47"/>
    </g>
  </g>
</svg>
