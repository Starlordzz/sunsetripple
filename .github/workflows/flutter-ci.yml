name: Flutter Multiplatform CI

on:
  push:
    branches:
      - master
      - 'feat/flutter*'
  pull_request:
    branches:
      - master

# 锁文件（pubspec.lock）里每个包都记着生成时的包源 host：本仓库是按国内镜像
# `PUB_HOSTED_URL=https://pub.flutter-io.cn` 生成的。CI 不设这个变量就会按
# `https://pub.dev` 解析，于是「62 个包全部对不上」→ `flutter pub get
# --enforce-lockfile` 在装依赖这一步 exit 65，且报错只有一句
# 「Would change 62 dependencies」，看不出是 host 不一致。
# 想换回官方源：先在同一个 host 下重生成锁
# （`PUB_HOSTED_URL=https://pub.dev flutter pub upgrade`），再改这里和
# Set up Flutter 上方注释里的版本说明。
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  test:
    name: Flutter Tests & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # test job 里也要跑 Kotlin 单测（JitterBuffer / OpusCodec），AGP 需要 JDK 17。
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 钉到具体补丁版本，不用 3.29.x：锁文件是用 3.29.0 生成的，而
      # `--enforce-lockfile` 在 CI 上是全新解析（空 pub 缓存 + 干净检出）；
      # SDK 补丁号一变，SDK 自带依赖的钉版就跟着变（实测 3.29.3 会让 glob /
      # io / mime / pool / pub_semver / yaml 六个包上调），解析结果与锁不符 →
      # 装依赖这一步 exit 65，后面所有质量门禁一步都跑不到。
      # 升级 Flutter 的顺序：改这里的版本号 → 用同一个 PUB_HOSTED_URL
      # `flutter pub upgrade` 重生成 pubspec.lock → 一起提交。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      # 包源不一致时 pub 只会吐一句「Would change 62 dependencies」，
      # 看不出根因，所以先自己把 host 对齐情况说清楚（顶部 env 有说明）。
      - name: Verify pub host matches lockfile
        run: |
          set -euo pipefail
          lock_hosts=$(grep -o 'url: "[^"]*"' pubspec.lock | sed 's/url: "//; s/"$//' | sort -u)
          expected="${PUB_HOSTED_URL:-https://pub.dev}"
          if [[ "$lock_hosts" != "$expected" ]]; then
            echo "::error::pubspec.lock 的包源是 [$lock_hosts]，当前 PUB_HOSTED_URL 是 [$expected]，两者必须一致（见本文件顶部 env 说明）"
            exit 1
          fi
          echo "包源一致：$lock_hosts"

      # 锁文件已入库，必须按锁文件解析：否则上游发新版会被静默采用，
      # 本地与 CI 解析出不同的依赖树就再也复现不了线上问题。
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # job 叫 Code Quality 就必须真的查质量，而不是只跑测试。
      - name: Static analysis
        run: flutter analyze

      # 时间相关规则必须注入时钟，否则「超时 N 秒」这类规则只能靠真的等时间来验证
      # （房主失联判定就因此长期零覆盖）。见 scripts/check-clock-injection.sh。
      - name: Enforce injectable clock in lib/core
        run: bash scripts/check-clock-injection.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run unit tests with coverage
        run: flutter test --coverage

      # 覆盖率此前只生成不上传、也不设阈值，等于白插桩一遍。
      - name: Enforce coverage threshold
        run: |
          set -euo pipefail
          if [[ ! -f coverage/lcov.info ]]; then
            echo "::error::coverage/lcov.info 不存在，覆盖率没有生成"
            exit 1
          fi
          # 统计 LF(可测行) 与 LH(已覆盖行)
          lf=$(grep -c '^LF:' coverage/lcov.info || true)
          total_lf=$(grep '^LF:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          total_lh=$(grep '^LH:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          if [[ -z "$total_lf" || "$total_lf" -eq 0 ]]; then
            echo "::error::lcov 里没有可测行统计"
            exit 1
          fi
          percent=$(awk "BEGIN { printf \"%.1f\", ($total_lh / $total_lf) * 100 }")
          echo "行覆盖率：$percent%（$total_lh / $total_lf）"
          # 当前基线 65.5%（151 用例）。门槛取 60，留出重构余量但能拦住
          # 「新增大段无测试代码」这类静默退化。
          awk "BEGIN { exit !($percent >= ${{ vars.MIN_COVERAGE_PERCENT || 60 }}) }" || {
            echo "::error::行覆盖率 $percent% 低于门槛"
            exit 1
          }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      # 抖动缓冲 / Opus 编解码是 Kotlin 原生逻辑，Flutter 侧测不到；
      # 这层决定通话音质（断音/回声/丢包），必须单独把关。
      - name: Run Android unit tests (JitterBuffer / OpusCodec)
        working-directory: android
        run: |
          # Windows 检出可能丢失可执行位，runner 上补回来。
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Upload Android unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          # 注意：android/build.gradle.kts 把 Gradle 构建目录重定向到了仓库根的 build/，
          # 报告不在 android/app/build 下。
          path: build/app/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  build-android:
    name: Build Flutter Android (.apk)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: build/app/outputs/flutter-apk/
          if-no-files-found: ignore
