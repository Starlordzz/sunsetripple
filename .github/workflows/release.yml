name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha.8)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. Android 构建链 (Flutter Release APK)
  # ==========================================
  build-android:
    name: Build Flutter Android Release (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      channel_tag: ${{ steps.metadata.outputs.channel_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 flutter-ci.yml 同一版本：锁文件按 3.29.0 生成，补丁号一变
          # --enforce-lockfile 就解析不过（见 flutter-ci.yml 里的说明）。
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Determine tag & metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version_name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

          if [[ "$version_name" == *-* ]]; then
            channel="prerelease"
            channel_tag="updates-prerelease"
          else
            channel="stable"
            channel_tag="updates-stable"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "channel_tag=$channel_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Restore Android release signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret。发布包必须用固定密钥签名，" >&2
            echo "::error::否则每次发布的签名都不同，用户无法覆盖升级。请先运行：" >&2
            echo "::error::  bash scripts/setup-release-signing.sh" >&2
            exit 1
          fi

          key_store_path="$RUNNER_TEMP/sunset-ripple-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$key_store_path"

          cat > android/key.properties <<EOF
          storeFile=$key_store_path
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "已写入 android/key.properties（keystore 位于 \$RUNNER_TEMP，不入库）"

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify APK is signed with the release key
        shell: bash
        run: |
          set -euo pipefail
          # 兜底断言：万一有人放宽 Gradle 守卫，这里也要拦住 debug 签名的「正式包」。
          apksigner="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$apksigner" ]]; then
            echo "::warning::找不到 apksigner，跳过签名断言"
            exit 0
          fi
          cert="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i 'Signer #1 certificate DN' || true)"
          echo "$cert"
          if [[ "$cert" == *"CN=Android Debug"* ]]; then
            echo "::error::release APK 是 debug 签名，绝不允许发布。" >&2
            exit 1
          fi

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.metadata.outputs.tag }}"
          version_name="${{ steps.metadata.outputs.version_name }}"
          apk_name="SunsetRipple-${tag}.apk"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/$apk_name"

          # 提取对应版本的更新日志并格式化为 GitHub Release 简洁格式
          {
            echo "# 更新日志"
            echo ""
            awk -v heading="## $version_name - " '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found && /^[-*] / {
                sub(/^[-*] /, "- ")
                print
              }
            ' CHANGELOG.md
          } > release-artifacts/release-notes.md

          if [[ $(grep -c '^- ' release-artifacts/release-notes.md) -eq 0 ]]; then
            echo "- 更新依赖项与常规问题修复" >> release-artifacts/release-notes.md
          fi

      # ==========================================================
      # 签名更新清单：App 内的「下载并安装」只认这份 update.json。
      #
      # 链路：sha256(APK) + 包名 + versionCode + 签名证书 SHA-256 + 摘要
      #      → 规范化 JSON → ECDSA P-256/SHA-256 签名 → release 资产 update.json
      # App 侧（lib/core/update/update_manifest.dart）用内置公钥验签，
      # 再逐字节比对 APK 的 SHA-256，最后交系统安装器。
      # 复用 scripts/SignUpdateManifest.java，绝不另写一套签名实现。
      # ==========================================================
      - name: Sign update manifest (update.json)
        shell: bash
        env:
          UPDATE_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.UPDATE_PRIVATE_KEY_PKCS8_BASE64 }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${UPDATE_PRIVATE_KEY_PKCS8_BASE64:-}" || -z "${UPDATE_PUBLIC_KEY_BASE64:-}" ]]; then
            echo "::error::缺少 UPDATE_PRIVATE_KEY_PKCS8_BASE64 / UPDATE_PUBLIC_KEY_BASE64 secret。" >&2
            echo "::error::没有它们就无法产出可被 App 验签的 update.json，发布必须失败而不是发出一份装不上的包。" >&2
            echo "::error::生成方式：java scripts/GenerateUpdateSigningKey.java .update-signing" >&2
            exit 1
          fi

          # secret 常常是从文件里粘进来的，可能带上 CRLF/空格；base64 字母表里没有空白，
          # 一律先清干净，免得因为一个 \r 让发布失败（或更糟：静默写出一个错公钥）。
          UPDATE_PUBLIC_KEY_BASE64="$(printf '%s' "$UPDATE_PUBLIC_KEY_BASE64" | tr -d '[:space:]')"
          UPDATE_PRIVATE_KEY_PKCS8_BASE64="$(printf '%s' "$UPDATE_PRIVATE_KEY_PKCS8_BASE64" | tr -d '[:space:]')"

          # App 内置的公钥写死在 lib/core/update/update_manifest.dart（跨两行字符串字面量）。
          # 它必须与 secret 完全一致：不一致就意味着用户拿到一份自己永远验不过的清单。
          builtin_key="$(sed -n '/const String kUpdateManifestPublicKeyBase64/,/;/p' \
            lib/core/update/update_manifest.dart | grep -o "'[^']*'" | tr -d "'" | tr -d '\n')"
          if [[ "$builtin_key" != "$UPDATE_PUBLIC_KEY_BASE64" ]]; then
            echo "::error::更新公钥不一致：" >&2
            echo "::error::  App 内置 : $builtin_key" >&2
            echo "::error::  CI secret: $UPDATE_PUBLIC_KEY_BASE64" >&2
            echo "::error::请同步常量与 secret 后重新发布。" >&2
            exit 1
          fi

          printf '%s' "$UPDATE_PRIVATE_KEY_PKCS8_BASE64" | base64 -d > "$RUNNER_TEMP/update-private-key.pk8"
          chmod 600 "$RUNNER_TEMP/update-private-key.pk8"

          # tag 与 pubspec 版本必须一致：清单里的 versionName/versionCode 来自它们，
          # 两者不一致时 App 展示的版本号和实际 APK 会对不上。
          # 用纯 bash 拆 `name+code`（先剥掉 CR，兼容 CRLF 检出）。
          tag="${{ steps.metadata.outputs.tag }}"
          version_name="${{ steps.metadata.outputs.version_name }}"
          pubspec_version="$(tr -d '\r' < pubspec.yaml | sed -n 's/^version:[[:space:]]*//p' | head -1)"
          pubspec_name="${pubspec_version%%+*}"
          version_code="${pubspec_version##*+}"
          if [[ -z "$pubspec_name" || "$pubspec_name" == "$pubspec_version" ]]; then
            echo "::error::无法从 pubspec.yaml 解析版本号（得到 '$pubspec_version'）" >&2
            exit 1
          fi
          if [[ "$pubspec_name" != "$version_name" ]]; then
            echo "::error::tag $tag 与 pubspec.yaml 版本 $pubspec_name 不一致" >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml 的构建号 '$version_code' 不是数字" >&2
            exit 1
          fi

          # 证书摘要取自**实际要发布的 APK**（而不是本地 keystore），
          # 这样清单里承诺的就是用户真正会装上的那个包的签名。
          apksigner="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::找不到 apksigner，无法读出 APK 的签名证书摘要" >&2
            exit 1
          fi
          certificate_sha256="$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2)}')"
          if [[ ! "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::无法解析签名证书 SHA-256（得到 '$certificate_sha256'）" >&2
            exit 1
          fi

          # 清单里的 summary：本次 CHANGELOG 小节的条目正文（去掉标题与空行）。
          awk 'NR==1 && /^# / { next } /^[[:space:]]*$/ { next } { print }' \
            release-artifacts/release-notes.md > release-artifacts/summary.txt
          if [[ ! -s release-artifacts/summary.txt ]]; then
            echo "::error::release-notes.md 里没有可用的更新摘要" >&2
            exit 1
          fi

          apk_name="SunsetRipple-${tag}.apk"
          java scripts/SignUpdateManifest.java \
            --version-code "$version_code" \
            --version-name "$version_name" \
            --channel "${{ steps.metadata.outputs.channel }}" \
            --minimum-version-code 1 \
            --package-name host.msknet.sunsetripple \
            --apk "release-artifacts/$apk_name" \
            --apk-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk_name}" \
            --certificate-sha256 "$certificate_sha256" \
            --summary-file release-artifacts/summary.txt \
            --private-key "$RUNNER_TEMP/update-private-key.pk8" \
            --public-key-base64 "$UPDATE_PUBLIC_KEY_BASE64" \
            --output release-artifacts/update.json

          python3 -c "import json; json.load(open('release-artifacts/update.json'))"
          echo "update.json 已签名（$(wc -c < release-artifacts/update.json) 字节）："
          cat release-artifacts/update.json

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/
          if-no-files-found: error

  # ==========================================
  # 2. iOS 构建链 · Flutter 统一核心 (.ipa, 未签名)
  # ==========================================
  build-ios-flutter:
    name: Build iOS Flutter (.ipa, unsigned)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 flutter-ci.yml 同一版本：锁文件按 3.29.0 生成，补丁号一变
          # --enforce-lockfile 就解析不过（见 flutter-ci.yml 里的说明）。
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p ios-flutter-artifacts/Payload
          cp -R build/ios/iphoneos/Runner.app ios-flutter-artifacts/Payload/
          cd ios-flutter-artifacts
          zip -qry "SunsetRipple-flutter-${tag}-unsigned.ipa" Payload
          rm -rf Payload
          ls -la

      - name: Upload iOS Flutter artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-flutter-release
          path: ios-flutter-artifacts/
          if-no-files-found: error

  # ==========================================
  # 3. HarmonyOS NEXT · 源码工程校验与打包
  #
  # 这里【不】产出 .hap，因为在 GitHub Actions 上产出真 HAP 不可行：
  #   1. 真 HAP 需要 hvigor 把 ArkTS 编成 .abc 字节码、restool 把资源编成
  #      resources.index、生成 module.json 与 pack.info，最后签名。
  #   2. DevEco 命令行工具 / HarmonyOS SDK 需华为开发者账号登录后下载，
  #      没有可供 CI 直接拉取的公开地址。
  #   3. 鸿蒙 NEXT 零售机只接受 AGC 调试证书签名（绑定设备 UDID、上限 100 台）
  #      或应用市场发布包，不存在未签名侧载路径。
  # 历史版本曾把源码 zip 改名成 .hap 发布（13 KB），那个文件无法安装，已移除。
  # 真机构建请用 DevEco Studio 打开 harmonyos/，见 docs/harmonyos-build.md。
  # ==========================================
  package-harmonyos:
    name: Validate & package HarmonyOS NEXT project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 捕捉「配置引用了不存在的资源」这类会让 hvigor 直接失败的问题。
      # alpha.8 时 $media:app_icon 被引用 3 次而 media/ 目录根本不存在，
      # 但当时 CI 只做 zip，所以一直没暴露。
      - name: Validate HarmonyOS project
        shell: bash
        run: bash scripts/check-harmonyos-resources.sh

      - name: Package HarmonyOS source project
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p harmonyos-artifacts
          zip -qry "harmonyos-artifacts/SunsetRipple-HarmonyOS-source-${tag}.zip" harmonyos/ \
            -x 'harmonyos/oh_modules/*' 'harmonyos/build/*' 'harmonyos/.hvigor/*'

      - name: Upload HarmonyOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-release
          path: harmonyos-artifacts/
          if-no-files-found: error

  # ==========================================
  # 4. 发布聚合（统一发布到 GitHub Release）
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios-flutter, package-harmonyos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: final-artifacts

      - name: Download iOS Flutter artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-flutter-release
          path: final-artifacts

      - name: Download HarmonyOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: harmonyos-release
          path: final-artifacts

      - name: Append install instructions to release notes
        shell: bash
        run: bash scripts/append-release-notes.sh final-artifacts/release-notes.md "${{ needs.build-android.outputs.tag }}"

      - name: Publish versioned GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build-android.outputs.tag }}"
          version_name="${{ needs.build-android.outputs.version_name }}"
          prerelease_args=()
          if [[ "$version_name" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          shopt -s nullglob
          upload_files=(final-artifacts/*.apk final-artifacts/*.ipa final-artifacts/*.zip final-artifacts/*.json)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${upload_files[@]}" --clobber
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$tag" \
              "${upload_files[@]}" \
              --verify-tag \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          fi
