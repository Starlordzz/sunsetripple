name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha.8)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# 与 flutter-ci.yml 相同的包源：锁文件是按国内镜像生成的，host 不一致会让
# `flutter pub get --enforce-lockfile` 直接失败（详见 flutter-ci.yml 顶部说明）。
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  # ==========================================
  # 1. Android 构建链 (Flutter Release APK)
  # ==========================================
  build-android:
    name: Build Flutter Android Release (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      channel_tag: ${{ steps.metadata.outputs.channel_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 flutter-ci.yml 同一版本，理由（锁文件在干净环境下全新解析）见
          # flutter-ci.yml 中 Set up Flutter 上方的说明。
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Determine tag & metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version_name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

          if [[ "$version_name" == *-* ]]; then
            channel="prerelease"
            channel_tag="updates-prerelease"
          else
            channel="stable"
            channel_tag="updates-stable"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "channel_tag=$channel_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run unit tests
        run: flutter test

      - name: Restore Android release signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret。发布包必须用固定密钥签名，" >&2
            echo "::error::否则每次发布的签名都不同，用户无法覆盖升级。请先运行：" >&2
            echo "::error::  bash scripts/setup-release-signing.sh" >&2
            exit 1
          fi

          key_store_path="$RUNNER_TEMP/sunset-ripple-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$key_store_path"

          cat > android/key.properties <<EOF
          storeFile=$key_store_path
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "已写入 android/key.properties（keystore 位于 \$RUNNER_TEMP，不入库）"

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify APK is signed with the release key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 兜底断言：万一有人放宽 Gradle 守卫，这里也要拦住 debug 签名的「正式包」。
          #
          # 这里曾经只是 `apksigner ... | grep 'Signer #1 certificate DN'`，而 2026-09-29 的
          # 发布实测 apksigner 在该 runner 上**退出码 0 且不输出任何内容**，于是变量为空、
          # 断言形同不存在（这一步照样打勾），错误被推迟到后面签名清单那一步才炸。
          # 现在统一走 scripts/apk-certificate-sha256.sh：它自己找 apksigner，验证失败或摘要缺失时直接失败。
          # keystore 仅用于交叉校验，不能替代对实际 APK 的验证。
          # 顺带把「APK 的签名证书 == 发布 keystore 的证书」这条更强的断言也做了（两边都能读到时必须一致）。
          cert="$(bash scripts/apk-certificate-sha256.sh \
            build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/sunset-ripple-release.p12" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS")"
          echo "APK 签名证书 SHA-256: $cert"

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.metadata.outputs.tag }}"
          version_name="${{ steps.metadata.outputs.version_name }}"
          apk_name="SunsetRipple-${tag}.apk"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/$apk_name"

          # 提取对应版本的更新日志并格式化为 GitHub Release 格式（完整保留正文段落与换行，避免截断）
          {
            echo "# 更新日志"
            echo ""
            awk -v heading="## $version_name - " '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba'
          } > release-artifacts/release-notes.md

          if [[ $(grep -E -c '^[*-] |^### ' release-artifacts/release-notes.md) -eq 0 ]]; then
            echo "- 更新依赖项与常规问题修复" >> release-artifacts/release-notes.md
          fi

      # ==========================================================
      # 签名更新清单：App 内的「下载并安装」只认这份 update.json。
      #
      # 链路：sha256(APK) + 包名 + versionCode + 签名证书 SHA-256 + 摘要
      #      → 规范化 JSON → ECDSA P-256/SHA-256 签名 → release 资产 update.json
      # App 侧（lib/core/update/update_manifest.dart）用内置公钥验签，
      # 再逐字节比对 APK 的 SHA-256，最后交系统安装器。
      # 复用 scripts/SignUpdateManifest.java，绝不另写一套签名实现。
      # ==========================================================
      - name: Sign update manifest (update.json)
        shell: bash
        env:
          UPDATE_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.UPDATE_PRIVATE_KEY_PKCS8_BASE64 }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_PUBLIC_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ -z "${UPDATE_PRIVATE_KEY_PKCS8_BASE64:-}" || -z "${UPDATE_PUBLIC_KEY_BASE64:-}" ]]; then
            echo "::error::缺少 UPDATE_PRIVATE_KEY_PKCS8_BASE64 / UPDATE_PUBLIC_KEY_BASE64 secret。" >&2
            echo "::error::没有它们就无法产出可被 App 验签的 update.json，发布必须失败而不是发出一份装不上的包。" >&2
            echo "::error::生成方式：java scripts/GenerateUpdateSigningKey.java .update-signing" >&2
            exit 1
          fi

          # secret 常常是从文件里粘进来的，可能带上 CRLF/空格；base64 字母表里没有空白，
          # 一律先清干净，免得因为一个 \r 让发布失败（或更糟：静默写出一个错公钥）。
          UPDATE_PUBLIC_KEY_BASE64="$(printf '%s' "$UPDATE_PUBLIC_KEY_BASE64" | tr -d '[:space:]')"
          UPDATE_PRIVATE_KEY_PKCS8_BASE64="$(printf '%s' "$UPDATE_PRIVATE_KEY_PKCS8_BASE64" | tr -d '[:space:]')"

          # App 内置的公钥写死在 lib/core/update/update_manifest.dart（跨两行字符串字面量）。
          # 它必须与 secret 完全一致：不一致就意味着用户拿到一份自己永远验不过的清单。
          builtin_key="$(sed -n '/const String kUpdateManifestPublicKeyBase64/,/;/p' \
            lib/core/update/update_manifest.dart | grep -o "'[^']*'" | tr -d "'" | tr -d '\n')"
          if [[ "$builtin_key" != "$UPDATE_PUBLIC_KEY_BASE64" ]]; then
            echo "::error::更新公钥不一致：" >&2
            echo "::error::  App 内置 : $builtin_key" >&2
            echo "::error::  CI secret: $UPDATE_PUBLIC_KEY_BASE64" >&2
            echo "::error::请同步常量与 secret 后重新发布。" >&2
            exit 1
          fi

          printf '%s' "$UPDATE_PRIVATE_KEY_PKCS8_BASE64" | base64 -d > "$RUNNER_TEMP/update-private-key.pk8"
          chmod 600 "$RUNNER_TEMP/update-private-key.pk8"

          # tag 与 pubspec 版本必须一致：清单里的 versionName/versionCode 来自它们，
          # 两者不一致时 App 展示的版本号和实际 APK 会对不上。
          # 用纯 bash 拆 `name+code`（先剥掉 CR，兼容 CRLF 检出）。
          tag="${{ steps.metadata.outputs.tag }}"
          version_name="${{ steps.metadata.outputs.version_name }}"
          apk_name="SunsetRipple-${tag}.apk"
          pubspec_version="$(tr -d '\r' < pubspec.yaml | sed -n 's/^version:[[:space:]]*//p' | head -1)"
          pubspec_name="${pubspec_version%%+*}"
          version_code="${pubspec_version##*+}"
          if [[ -z "$pubspec_name" || "$pubspec_name" == "$pubspec_version" ]]; then
            echo "::error::无法从 pubspec.yaml 解析版本号（得到 '$pubspec_version'）" >&2
            exit 1
          fi
          if [[ "$pubspec_name" != "$version_name" ]]; then
            echo "::error::tag $tag 与 pubspec.yaml 版本 $pubspec_name 不一致" >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml 的构建号 '$version_code' 不是数字" >&2
            exit 1
          fi

          # 所有历史版本 tag 的构建号都必须低于本次发布；相同提交重跑允许。
          while IFS= read -r previous_tag; do
            if [[ "$(git rev-parse "$previous_tag^{commit}")" == "$(git rev-parse HEAD)" ]]; then
              continue
            fi
            previous_version="$(git show "$previous_tag:pubspec.yaml" 2>/dev/null | sed -n 's/^version: *//p' | tr -d '\r')"
            previous_code="${previous_version##*+}"
            if [[ "$previous_code" =~ ^[0-9]+$ ]] && (( 10#$previous_code >= 10#$version_code )); then
              echo "::error::versionCode $version_code 必须高于历史版本 $previous_tag 的 $previous_code" >&2
              exit 1
            fi
          done < <(git tag --list 'v[0-9]*')

          # 证书摘要取自**实际要发布的 APK**（而不是本地 keystore），
          # 这样清单里承诺的就是用户真正会装上的那个包的签名。
          # apksigner 在某些 runner 上会退出码 0 却不输出内容（见校验步骤的说明），
          # 所以统一走 scripts/apk-certificate-sha256.sh：要求 APK 验证成功并读到摘要，
          # keystore 仅用于交叉校验——绝不接受未验证的 APK 或空摘要。
          certificate_sha256="$(bash scripts/apk-certificate-sha256.sh \
            "release-artifacts/$apk_name" \
            "$RUNNER_TEMP/sunset-ripple-release.p12" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS")"
          if [[ ! "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::无法解析签名证书 SHA-256（得到 '$certificate_sha256'）" >&2
            exit 1
          fi
          echo "更新清单将声明证书 SHA-256: $certificate_sha256"

          # 清单里的 summary：本次 CHANGELOG 小节的条目正文（去掉标题与空行）。
          awk 'NR==1 && /^# / { next } /^[[:space:]]*$/ { next } { print }' \
            release-artifacts/release-notes.md > release-artifacts/summary.txt
          if [[ ! -s release-artifacts/summary.txt ]]; then
            echo "::error::release-notes.md 里没有可用的更新摘要" >&2
            exit 1
          fi

          java scripts/SignUpdateManifest.java \
            --version-code "$version_code" \
            --version-name "$version_name" \
            --channel "${{ steps.metadata.outputs.channel }}" \
            --minimum-version-code 1 \
            --package-name host.msknet.sunsetripple \
            --apk "release-artifacts/$apk_name" \
            --apk-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk_name}" \
            --certificate-sha256 "$certificate_sha256" \
            --summary-file release-artifacts/summary.txt \
            --private-key "$RUNNER_TEMP/update-private-key.pk8" \
            --public-key-base64 "$UPDATE_PUBLIC_KEY_BASE64" \
            --output release-artifacts/update.json

          python3 -c "import json; json.load(open('release-artifacts/update.json'))"
          echo "update.json 已签名（$(wc -c < release-artifacts/update.json) 字节）："
          cat release-artifacts/update.json

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/
          if-no-files-found: error

  # ==========================================
  # 2. 发布聚合（仅 Android APK + 签名更新清单）
  # iOS 与 HarmonyOS NEXT 已暂停开发与发版，ios/、harmonyos/ 目录冻结占位，见 docs/platform-support.md。
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: final-artifacts

      - name: Append install instructions to release notes
        shell: bash
        run: bash scripts/append-release-notes.sh final-artifacts/release-notes.md "${{ needs.build-android.outputs.tag }}"

      - name: Publish versioned GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build-android.outputs.tag }}"
          version_name="${{ needs.build-android.outputs.version_name }}"
          prerelease_args=()
          if [[ "$version_name" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          shopt -s nullglob
          upload_files=(final-artifacts/*.apk final-artifacts/*.json)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${upload_files[@]}" --clobber
            gh release edit "$tag" \
              --tag "$tag" \
              --draft=false \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$tag" \
              "${upload_files[@]}" \
              --verify-tag \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          fi

      - name: Update rolling channel manifest
        shell: bash
        run: |
          set -euo pipefail
          # 滚动通道：一个固定 tag 的 Release，只挂最新一份签名清单 update.json。
          # docs/wiki/构建与发布.md 说「Actions 会自动更新 updates-prerelease / updates-stable」，
          # 但 workflow 里一直没有这一步，通道里的清单停在 2026-08-22——这里把缺口补上。
          # 固定 tag 不是 SemVer，App 侧的版本选择逻辑会忽略它，不会被误当成新版本。
          channel="${{ needs.build-android.outputs.channel }}"
          channel_tag="${{ needs.build-android.outputs.channel_tag }}"
          manifest="final-artifacts/update.json"
          if [[ ! -f "$manifest" ]]; then
            echo "::error::final-artifacts/update.json 不存在，滚动通道无法更新。" >&2
            exit 1
          fi

          channel_flags=()
          if [[ "$channel" == "prerelease" ]]; then
            channel_flags+=(--prerelease)
          fi

          if gh release view "$channel_tag" >/dev/null 2>&1; then
            gh release upload "$channel_tag" "$manifest" --clobber
            gh release edit "$channel_tag" --draft=false "${channel_flags[@]}"
          else
            gh release create "$channel_tag" "$manifest" \
              --title "SunsetRipple ${channel} update channel" \
              --notes "滚动更新通道：始终挂最新一份签名清单（update.json），具体版本以清单内容为准。" \
              "${channel_flags[@]}"
          fi
          echo "已更新滚动通道 $channel_tag 的 update.json"
