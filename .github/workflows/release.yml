name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha.8)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. Android 构建链 (Flutter Release APK)
  # ==========================================
  build-android:
    name: Build Flutter Android Release (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      channel_tag: ${{ steps.metadata.outputs.channel_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Determine tag & metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version_name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

          if [[ "$version_name" == *-* ]]; then
            channel="prerelease"
            channel_tag="updates-prerelease"
          else
            channel="stable"
            channel_tag="updates-stable"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "channel_tag=$channel_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.metadata.outputs.tag }}"
          version_name="${{ steps.metadata.outputs.version_name }}"
          apk_name="SunsetRipple-${tag}.apk"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/$apk_name"

          # 提取对应版本的 CHANGELOG 内容
          awk -v heading="## $version_name - " '
            index($0, heading) == 1 { found = 1 }
            found && /^## / && index($0, heading) != 1 { exit }
            found { print }
            END { if (!found) exit 0 }
          ' CHANGELOG.md > release-artifacts/release-notes.md

          if [[ ! -s release-artifacts/release-notes.md ]]; then
            echo "## SunsetRipple $tag" > release-artifacts/release-notes.md
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-artifacts/
          if-no-files-found: error

  # ==========================================
  # 2a. iOS 构建链 · Flutter 统一核心 (.ipa, 未签名)
  #
  # 与 Android 同源：同一套 Dart 会话核心 / 帧协议 / 加密。
  # 目前仍是「可安装但功能未接通」的外壳，缺口见 docs/ios-flutter-port.md：
  #   - ios/Runner/PlatformAudioPlugin.swift 是空文件，平台音频通道未实现
  #   - LanRoomDiscovery 走 255.255.255.255 广播，iOS 14+ 需 multicast 授权，必须改 Bonjour
  #   - 无 CBL2CAPChannel 实现
  # 因此 2b 的原生构建暂不下线，两者并行发布，产物名区分。
  # ==========================================
  build-ios-flutter:
    name: Build iOS Flutter (.ipa, unsigned)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p ios-flutter-artifacts/Payload
          cp -R build/ios/iphoneos/Runner.app ios-flutter-artifacts/Payload/
          cd ios-flutter-artifacts
          zip -qry "SunsetRipple-flutter-${tag}-unsigned.ipa" Payload
          rm -rf Payload
          ls -la

      - name: Upload iOS Flutter artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-flutter-release
          path: ios-flutter-artifacts/
          if-no-files-found: error

  # ==========================================
  # 3. HarmonyOS NEXT · 源码工程校验与打包
  #
  # 这里【不】产出 .hap，因为在 GitHub Actions 上产出真 HAP 不可行：
  #   1. 真 HAP 需要 hvigor 把 ArkTS 编成 .abc 字节码、restool 把资源编成
  #      resources.index、生成 module.json 与 pack.info，最后签名。
  #   2. DevEco 命令行工具 / HarmonyOS SDK 需华为开发者账号登录后下载，
  #      没有可供 CI 直接拉取的公开地址。
  #   3. 鸿蒙 NEXT 零售机只接受 AGC 调试证书签名（绑定设备 UDID、上限 100 台）
  #      或应用市场发布包，不存在未签名侧载路径。
  # 历史版本曾把源码 zip 改名成 .hap 发布（13 KB），那个文件无法安装，已移除。
  # 真机构建请用 DevEco Studio 打开 harmonyos/，见 docs/harmonyos-build.md。
  # ==========================================
  package-harmonyos:
    name: Validate & package HarmonyOS NEXT project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 捕捉「配置引用了不存在的资源」这类会让 hvigor 直接失败的问题。
      # alpha.8 时 $media:app_icon 被引用 3 次而 media/ 目录根本不存在，
      # 但当时 CI 只做 zip，所以一直没暴露。
      - name: Validate HarmonyOS project
        shell: bash
        run: bash scripts/check-harmonyos-resources.sh

      - name: Package HarmonyOS source project
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p harmonyos-artifacts
          zip -qry "harmonyos-artifacts/SunsetRipple-HarmonyOS-source-${tag}.zip" harmonyos/ \
            -x 'harmonyos/oh_modules/*' 'harmonyos/build/*' 'harmonyos/.hvigor/*'

      - name: Upload HarmonyOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: harmonyos-release
          path: harmonyos-artifacts/
          if-no-files-found: error

  # ==========================================
  # 4. 发布聚合（统一发布到 GitHub Release）
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios-flutter, package-harmonyos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: final-artifacts

      - name: Download iOS Flutter artifacts
        uses: actions/download-artifact@v8
        with:
          name: ios-flutter-release
          path: final-artifacts

      - name: Download HarmonyOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: harmonyos-release
          path: final-artifacts

      - name: Append install instructions to release notes
        shell: bash
        run: |
          set -euo pipefail
          cat >> final-artifacts/release-notes.md <<'EOF'

---

### 各产物怎么装

| 产物 | 平台 | 安装方式 |
| --- | --- | --- |
| `SunsetRipple-*.apk` | Android 8.0+ | 直接安装 |
| `SunsetRipple-flutter-*-unsigned.ipa` | iOS 15+ | **未签名**，需用 AltStore / Sideloadly 以自己的 Apple ID 在本地重签后安装 |
| `SunsetRipple-HarmonyOS-source-*.zip` | HarmonyOS NEXT | 源码工程，需用 DevEco Studio 打开自行构建并签名 |

          iOS 未提供「下载即装」包：Apple 要求安装包必须经过签名，而签名需要
          Apple Developer Program（99 美元/年）证书；ad-hoc 分发还需预先登记设备 UDID。

          HarmonyOS NEXT 未提供 `.hap`：鸿蒙零售机只接受 AGC 调试证书（绑定设备 UDID）
          或应用市场发布包签名的 HAP，且 DevEco 命令行工具需华为开发者账号登录才能获取，
          无法在公共 CI 上构建。
          EOF

      - name: Publish versioned GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build-android.outputs.tag }}"
          version_name="${{ needs.build-android.outputs.version_name }}"
          prerelease_args=()
          if [[ "$version_name" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          shopt -s nullglob
          upload_files=(final-artifacts/*.apk final-artifacts/*.ipa final-artifacts/*.zip)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${upload_files[@]}" --clobber
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$tag" \
              "${upload_files[@]}" \
              --verify-tag \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          fi
