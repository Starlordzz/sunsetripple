name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0-alpha.7
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Flutter Android Release (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Determine tag & metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version_name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.metadata.outputs.tag }}"
          version_name="${{ steps.metadata.outputs.version_name }}"
          apk_name="SunsetRipple-${tag}.apk"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/$apk_name"

          # 提取对应版本的 CHANGELOG 内容
          awk -v heading="## $version_name - " '
            index($0, heading) == 1 { found = 1 }
            found && /^## / && index($0, heading) != 1 { exit }
            found { print }
            END { if (!found) exit 0 }
          ' CHANGELOG.md > release-artifacts/release-notes.md

          if [[ ! -s release-artifacts/release-notes.md ]]; then
            echo "## SunsetRipple $tag" > release-artifacts/release-notes.md
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: final-artifacts

      - name: Publish versioned GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build-android.outputs.tag }}"
          version_name="${{ needs.build-android.outputs.version_name }}"
          prerelease_args=()
          if [[ "$version_name" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          shopt -s nullglob
          upload_files=(final-artifacts/*.apk)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${upload_files[@]}" --clobber
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$tag" \
              "${upload_files[@]}" \
              --title "$tag" \
              --notes-file final-artifacts/release-notes.md \
              "${prerelease_args[@]}"
          fi
